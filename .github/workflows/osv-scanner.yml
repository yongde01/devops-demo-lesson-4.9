name: osv-scanner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 1 * * 1"   # every Monday 01:30 UTC (09:30 Singapore)
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step A: Setup JDK/Runtime
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step B: Generate aggregate SBOM with all transitive deps
      - name: Generate CycloneDX SBOM
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      # Step C: Scan the SBOM
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --sbom=target/bom.json
            --format=sarif
            --output=results.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()               # <--- Ensures upload runs even if previous step fails
        with:
         sarif_file: results.sarif